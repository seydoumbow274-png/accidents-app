<!DOCTYPE html>
<html>
<head>
    <title>Accidents App</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

<h1>Bienvenue sur Accidents App</h1>

<nav>
    <a href="/">Accueil</a> |
    <a href="/about">À propos</a>
</nav>

<div id="map" style="height: 500px;"></div>

<button onclick="getLocation()">📍 Ma position</button>
<button onclick="enableReport()">🚨 Signaler un accident</button>

<script>// Charger les accidents existants depuis le serveur
fetch('/accidents')
.then(response => response.json())
.then(data => {
    data.forEach(acc => {
        L.marker([acc.lat, acc.lon]).addTo(map)
         .bindPopup("Accident signalé")
    });
});

 var map = L.map('map').setView([14.7167, -17.4677], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

function getLocation() {
    navigator.geolocation.getCurrentPosition(
        function(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;

            map.setView([lat, lon], 15);

            L.marker([lat, lon]).addTo(map)
                .bindPopup("Vous êtes ici")
                .openPopup();
        },
        function(error) {
            alert("Impossible de récupérer la position");
        },
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}

function enableReport() {
    alert("Clique sur la carte pour signaler un accident");

    map.once('click', function(e) {
        var lat = e.latlng.lat;
        var lon = e.latlng.lng;

        fetch('/report', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({lat: lat, lon: lon})
        });

        L.marker([lat, lon]).addTo(map)
            .bindPopup("Accident signalé")
            .openPopup();
    });
}
</script>

</body>
</html>
