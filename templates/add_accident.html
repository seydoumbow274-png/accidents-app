<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un accident</title>
</head>
<body>
    <h1>Ajouter un accident</h1>
    <form action="/add" method="POST">
        <label>Date: <input type="date" name="date" required></label><br><br>
        <label>Lieu: <input type="text" name="lieu" required></label><br><br>
        <label>Type: <input type="text" name="type" required></label><br><br>
        <button type="submit">Ajouter</button>
    </form>
    <br>
    <a href="/">Retour à l'accueil</a>
</body>
</html>
