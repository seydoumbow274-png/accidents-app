<!DOCTYPE html>
<html>
<head>
    <title>Accidents App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-size: 20px; margin: 0; padding: 0; font-family: sans-serif; }
        nav a { display: block; padding: 15px; text-align: center; font-size: 22px; text-decoration: none; background: #4CAF50; color: white; margin-bottom: 2px; }
        nav a:hover { background: #45a049; }
        button { font-size: 24px; padding: 15px; width: 100%; margin-top: 10px; }
        textarea, input { font-size: 20px; padding: 10px; width: 100%; margin-top: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Accueil</a>
        <a href="/signaler">Signaler un accident</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
