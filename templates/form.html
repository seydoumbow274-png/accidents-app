<!DOCTYPE html>
<html>
<head>
    <title>Signalement d'accident</title>
</head>
<body>
    <h2>Signaler un accident</h2>

    <form method="POST">
        Nom : <input type="text" name="nom" required><br><br>
        Lieu : <input type="text" name="lieu" required><br><br>
        Description : <br>
        <textarea name="description" rows="4" cols="40" required></textarea><br><br>
        <button type="submit">Signaler</button>
    </form>

</body>
</html>
